<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!--
    Ready to start for LevelUp: the published https://visualfx.vercel.app/, embedded as it is (not copied).
    Its CTA is a plain link to Start without a target, so on its own it would open Start inside this frame. Here that
    navigation is refused (frame-src) and LevelUp opens Start in the top window, with the context of the visit.
    Only this wrapper carries the policy: the demos embedded by LevelUp are not restricted.
  -->
  <meta http-equiv="Content-Security-Policy" content="frame-src https://visualfx.vercel.app">
  <meta name="robots" content="noindex">
  <title>Ready to start? — Memento</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
    /* The published page draws its card 8 px inside its viewport, on a near-black page. The frame is 16 px larger than
       this box, so the card lands exactly on the LevelUp tab; the margin and the corners outside the cut are clipped
       on the card's own outline (viewBox 1000 × 800: cuts of 3.5 % × 4.375 %). */
    iframe{position:absolute;left:-8px;top:-8px;width:calc(100% + 16px);height:calc(100% + 16px);border:0;display:block;
      background:transparent;color-scheme:normal;
      clip-path:polygon(calc(8px + (100% - 16px) * .035) 8px,calc(100% - 8px) 8px,calc(100% - 8px) calc(8px + (100% - 16px) * .95625),
        calc(8px + (100% - 16px) * .965) calc(100% - 8px),8px calc(100% - 8px),8px calc(8px + (100% - 16px) * .04375))}
  </style>
</head>
<body>
  <iframe src="https://visualfx.vercel.app/" title="Ready to start?" tabindex="-1"
    sandbox="allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation"
    referrerpolicy="strict-origin-when-cross-origin"></iframe>
  <script>
  (() => {
    const EFFECT = 'https://visualfx.vercel.app/';
    const START = 'https://mementostudio.it/start?from=levelup';
    const frame = document.querySelector('iframe');
    const hosted = window.parent !== window;
    let started = false, loads = 0;
    const tell = event => { if (hosted) parent.postMessage({ type: 'memento:ready-to-start', version: 1, event }, location.origin); };
    const start = () => {
      if (started) return;
      started = true;
      // what the frame shows now is the refused navigation: hidden, LevelUp's plain CTA is underneath
      frame.style.visibility = 'hidden';
      if (hosted) tell('start');
      else location.href = START;
    };
    // The CTA inside the effect tried to navigate this frame (Chrome, Firefox, Safari report it here).
    document.addEventListener('securitypolicyviolation', event => {
      if (event.effectiveDirective === 'frame-src' || event.violatedDirective === 'frame-src') start();
    });
    // Any second document in the frame means the effect navigated away: a refused navigation still loads an error
    // page, and a browser that does not refuse it loads Start in the frame.
    frame.addEventListener('load', () => { if (++loads === 1) tell('ready'); else start(); });
    const slow = setTimeout(() => { if (!loads) tell('fallback'); }, 15000);
    frame.addEventListener('load', () => clearTimeout(slow), { once: true });
    // Back from Start through the page cache: the effect again, not the refused navigation.
    addEventListener('pageshow', event => {
      if (!event.persisted || !started) return;
      started = false; loads = 0;
      frame.style.visibility = '';
      frame.src = EFFECT;
    });
  })();
  </script>
</body>
</html>
