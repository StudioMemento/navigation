<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Memento — Esplora</title><meta name="description" content="Memento Studio. Un mondo di idee, progetti e nuove possibilità.">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#090909">
<link rel="icon" href="/assets/home.svg" type="image/svg+xml"><link rel="stylesheet" href="/style.css">
<script type="importmap">{"imports":{"three":"/vendor/three.module.js"}}</script>
<script type="module" src="/src/app.mjs"></script>
</head>
<body>
<main id="world" aria-label="Esplora il mondo Memento">
<canvas id="canvas" aria-label="Cinque stazioni Memento. Usa anche la barra di navigazione."></canvas>
<div id="world-hud" hidden>
<button id="home" class="hud home" aria-label="Torna alla stazione Memento"><img src="/assets/home.svg" alt=""></button>
<button id="previous" class="hud previous" aria-label="Stazione precedente"><img src="/assets/left.svg" alt=""></button>
<button id="next" class="hud next" aria-label="Stazione successiva"><img src="/assets/right.svg" alt=""></button>
<button id="enter" class="hud enter" aria-label="Entra nella pagina"><img src="/assets/down.svg" alt=""></button>
<p id="hint"></p>
</div>
<div id="loader" class="loader" role="status"><span class="pulse"></span><p>Il mondo prende forma</p></div>
</main>
<div id="transition" aria-hidden="true"></div>
<section id="page-shell" hidden aria-label="Contenuti Memento">
<div id="page-frame-wrap"></div>
<div id="page-loader" class="loader" role="status"><span class="pulse"></span><p>Apertura della pagina</p></div>
<div id="page-error" class="error-card" hidden role="alert"><h1>La pagina tarda ad arrivare</h1><p>Puoi riprovare o aprirla direttamente dal link in alto.</p><button id="retry-page">Riprova</button><button id="cancel-page">Torna a esplorare</button></div>
</section>
<button id="return" class="utility return" hidden aria-label="Torna al mondo 3D">↑ <span>Esplora</span></button>
<a id="original" class="utility original" hidden href="https://mementostudio.vercel.app/" target="_blank" rel="noopener" aria-label="Apri la pagina originale in una nuova scheda">↗ <span>Apri pagina</span></a>
<button id="pause" class="pause" hidden aria-pressed="false">Ferma ambiente</button>
<div id="world-error" class="error-card" hidden role="alert"><h1>Continua a esplorare</h1><p>Il mondo 3D non è disponibile su questa sessione. Tutte le pagine sono accessibili.</p><div class="fallback-links"><a data-open-page="memento" href="/studio/">Memento</a><a data-open-page="services" href="/services/">Services</a><a data-open-page="projects" href="/projects/">Projects</a><a data-open-page="levelup" href="/levelup/">LevelUp</a><a data-open-page="start" href="/start/">Start</a></div></div>
<p id="status" class="sr-only" role="status" aria-live="polite"></p>
<noscript><div class="error-card"><h1>Memento</h1><p>Apri una delle nostre pagine:</p><div class="fallback-links"><a href="https://mementostudio.vercel.app/">Studio</a><a href="https://mementoservizi.vercel.app/">Services</a><a href="https://mementoportfolio.vercel.app/">Projects</a><a href="https://mementolevelup.vercel.app/">LevelUp</a><a href="https://mementostart.vercel.app/">Start</a></div></div></noscript>
</body>
</html>
