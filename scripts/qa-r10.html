<!doctype html><html lang="it"><meta charset="utf-8"><title>NAV R10 — verifica interazioni</title><style>body{margin:0;background:#1d1d1d;color:#fff;font:13px system-ui}header{padding:10px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}button{background:#333;color:#fff;border:1px solid #555;padding:6px 9px}iframe{display:block;border:0;margin:auto;width:1200px;height:800px;max-width:100vw}output{padding:8px;white-space:pre-wrap;display:block}</style><header><button id="inspect">Misure</button><button id="short">Mobile basso</button><button id="host">Host alto / visibile 724</button><button id="desktop">Desktop</button><button id="background">Solo fondo</button><button id="bg-hover">Luce fondo</button><button id="resize-test">Resize rapido</button><button id="mobile">Mobile 390</button><button id="corner">Angolo</button><button id="type">Typo</button><button id="chevron">Chevron</button><button id="idle">Idle</button><button id="rapid">10 slide rapide</button><button id="reveal">Reveal 55%</button><button id="reset">Reveal completo</button><button id="reduced">Reduced motion</button></header><output id="result">Pronto</output><iframe title="Anteprima NAV" src="./?qa"></iframe><script>
const frame=document.querySelector('iframe'),out=document.querySelector('output');let ticker;
function pointer(x,y){const w=frame.contentWindow;w.dispatchEvent(new w.PointerEvent('pointermove',{clientX:x,clientY:y,pointerType:'mouse',isPrimary:true,bubbles:true}));}
function hover(target){clearInterval(ticker);const w=frame.contentWindow,d=w.document,card=d.querySelector('.card[aria-current="page"]'),r=card.getBoundingClientRect(),title=card.querySelector('.title').getBoundingClientRect(),chevron=d.querySelector('#next').getBoundingClientRect();let x,y;if(target==='corner'){x=r.left+14;y=r.top+9;}if(target==='type'){x=title.left+title.width*.25;y=title.top+title.height*.5;}if(target==='chevron'){x=chevron.x+chevron.width/2;y=chevron.y+chevron.height/2;}pointer(x,y);ticker=setInterval(()=>pointer(x,y),30);out.textContent='Hover '+target;}
document.querySelector('#corner').onclick=()=>hover('corner');document.querySelector('#type').onclick=()=>hover('type');document.querySelector('#chevron').onclick=()=>hover('chevron');
document.querySelector('#idle').onclick=()=>{clearInterval(ticker);frame.contentWindow.dispatchEvent(new frame.contentWindow.Event('blur'));out.textContent='Idle';};
document.querySelector('#mobile').onclick=()=>{clearInterval(ticker);frame.style.width='390px';frame.style.height='844px';out.textContent='390 × 844';};
document.querySelector('#desktop').onclick=()=>{clearInterval(ticker);frame.style.width='1200px';frame.style.height='800px';out.textContent='1200 × 800';};
document.querySelector('#rapid').onclick=async()=>{clearInterval(ticker);const w=frame.contentWindow,d=w.document,results=[];for(let i=0;i<10;i++){d.querySelector('#next').click();const card=d.querySelector('.card[aria-current="page"]').dataset.page,nav=d.querySelector('memento-nav').shadowRoot.querySelector('a[aria-current="page"]').href.split('/').pop();results.push({card,nav,sync:card===nav});await new Promise(r=>setTimeout(r,60));}out.textContent=JSON.stringify({rapid:results.every(x=>x.sync)?'PASS':'FAIL',results});};
function reveal(value){clearInterval(ticker);const w=frame.contentWindow,input=w.document.querySelector('input');input.value=value;input.dispatchEvent(new w.Event('input',{bubbles:true}));out.textContent='Reveal '+value+'%';}
document.querySelector('#reveal').onclick=()=>reveal(55);document.querySelector('#reset').onclick=()=>reveal(100);
document.querySelector('#reduced').onclick=()=>{clearInterval(ticker);frame.src='./?qa&motion=reduce';out.textContent='Reduced motion';};

document.querySelector('#background').onclick=()=>{const d=frame.contentDocument;let st=d.querySelector('#qa-isolate');if(st)st.remove();else{st=d.createElement('style');st.id='qa-isolate';st.textContent='#scene,.chevron,memento-nav,.qa-controls{visibility:hidden!important}';d.head.append(st);}out.textContent='Fondo isolato';};
document.querySelector('#bg-hover').onclick=()=>{clearInterval(ticker);const w=frame.contentWindow,x=w.innerWidth*.22,y=w.innerHeight*.45;pointer(x,y);ticker=setInterval(()=>pointer(x,y),30);out.textContent='Luce locale fondo';};
document.querySelector('#resize-test').onclick=async()=>{clearInterval(ticker);const sizes=[[390,844],[1000,600],[430,900],[1200,800]],rows=[];for(const [w,h]of sizes){frame.style.width=w+'px';frame.style.height=h+'px';await new Promise(r=>setTimeout(r,180));const d=frame.contentDocument,c=d.querySelector('.card[aria-current="page"]').getBoundingClientRect();rows.push({w:frame.clientWidth,h,cardWidth:+c.width.toFixed(1),center:+(c.x+c.width/2).toFixed(1),viewport:d.documentElement.clientWidth});}await new Promise(r=>setTimeout(r,900));out.textContent=JSON.stringify({resize:rows.every(r=>Math.abs(r.center-r.viewport/2)<2)?'PASS':'FAIL',rows,qa:JSON.parse(frame.contentDocument.querySelector('#hub').dataset.qa||'{}')});};

document.querySelector('#short').onclick=()=>{frame.style.width='390px';frame.style.height='480px';out.textContent='390 × 480';};
document.querySelector('#host').onclick=()=>{frame.style.width='390px';frame.style.height='844px';frame.contentWindow.dispatchEvent(new MessageEvent('message',{source:window,origin:'https://mementostudio.it',data:{channel:'memento:hub-viewport',version:1,type:'VIEWPORT',height:724}}));out.textContent='Host simulato: iframe 844, visibile 724';};
document.querySelector('#inspect').onclick=()=>{const w=frame.contentWindow,d=w.document,rect=e=>{const r=e.getBoundingClientRect();return {x:r.x,y:r.y,width:r.width,height:r.height,bottom:r.bottom};},active=d.querySelector('.card[aria-current="page"]'),dock=d.querySelector('memento-nav').shadowRoot.querySelector('.mm-dock');out.textContent=JSON.stringify({viewport:{width:w.innerWidth,height:w.innerHeight,visible:d.documentElement.style.getPropertyValue('--nav-viewport-height')},card:rect(active),dock:rect(dock),depth:[...d.querySelectorAll('.card:not([hidden])')].map(c=>({id:c.dataset.page,slot:c.dataset.slot,opacity:c.querySelector('.card-shade').style.opacity,gradient:w.getComputedStyle(c.querySelector('.card-shade')).backgroundImage})),shadowLayers:d.querySelectorAll('.card-shadow').length,images:[...d.querySelectorAll('.card-image')].map(i=>({w:i.naturalWidth,complete:i.complete})),qa:d.querySelector('#hub').dataset.qa});};
</script></html>
