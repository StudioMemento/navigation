<!doctype html><html lang="it"><meta charset="utf-8"><title>NAV R8 — verifica interazioni</title><style>body{margin:0;background:#1d1d1d;color:#fff;font:13px system-ui}header{padding:10px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}button{background:#333;color:#fff;border:1px solid #555;padding:6px 9px}iframe{display:block;border:0;margin:auto;width:1200px;height:800px;max-width:100vw}output{padding:8px;white-space:pre-wrap;display:block}</style><header><button id="desktop">Desktop</button><button id="mobile">Mobile 390</button><button id="corner">Angolo</button><button id="type">Typo</button><button id="chevron">Chevron</button><button id="idle">Idle</button><button id="rapid">10 slide rapide</button><button id="reveal">Reveal 55%</button><button id="reset">Reveal completo</button><button id="reduced">Reduced motion</button></header><output id="result">Pronto</output><iframe title="Anteprima NAV" src="./?qa"></iframe><script>
const frame=document.querySelector('iframe'),out=document.querySelector('output');let ticker;
function pointer(x,y){const w=frame.contentWindow;w.dispatchEvent(new w.PointerEvent('pointermove',{clientX:x,clientY:y,pointerType:'mouse',isPrimary:true,bubbles:true}));}
function hover(target){clearInterval(ticker);const w=frame.contentWindow,d=w.document,card=d.querySelector('.card[aria-current="page"]'),r=card.getBoundingClientRect(),title=card.querySelector('.title').getBoundingClientRect(),chevron=d.querySelector('#next').getBoundingClientRect();let x,y;if(target==='corner'){x=r.left+14;y=r.top+9;}if(target==='type'){x=title.left+title.width*.25;y=title.top+title.height*.5;}if(target==='chevron'){x=chevron.x+chevron.width/2;y=chevron.y+chevron.height/2;}pointer(x,y);ticker=setInterval(()=>pointer(x,y),30);out.textContent='Hover '+target;}
document.querySelector('#corner').onclick=()=>hover('corner');document.querySelector('#type').onclick=()=>hover('type');document.querySelector('#chevron').onclick=()=>hover('chevron');
document.querySelector('#idle').onclick=()=>{clearInterval(ticker);frame.contentWindow.dispatchEvent(new frame.contentWindow.Event('blur'));out.textContent='Idle';};
document.querySelector('#mobile').onclick=()=>{clearInterval(ticker);frame.style.width='390px';frame.style.height='844px';out.textContent='390 × 844';};
document.querySelector('#desktop').onclick=()=>{clearInterval(ticker);frame.style.width='1200px';frame.style.height='800px';out.textContent='1200 × 800';};
document.querySelector('#rapid').onclick=async()=>{clearInterval(ticker);const w=frame.contentWindow,d=w.document,results=[];for(let i=0;i<10;i++){d.querySelector('#next').click();const card=d.querySelector('.card[aria-current="page"]').dataset.page,nav=d.querySelector('memento-nav').shadowRoot.querySelector('a[aria-current="page"]').href.split('/').pop();results.push({card,nav,sync:card===nav});await new Promise(r=>setTimeout(r,60));}out.textContent=JSON.stringify({rapid:results.every(x=>x.sync)?'PASS':'FAIL',results});};
function reveal(value){clearInterval(ticker);const w=frame.contentWindow,input=w.document.querySelector('input');input.value=value;input.dispatchEvent(new w.Event('input',{bubbles:true}));out.textContent='Reveal '+value+'%';}
document.querySelector('#reveal').onclick=()=>reveal(55);document.querySelector('#reset').onclick=()=>reveal(100);
document.querySelector('#reduced').onclick=()=>{clearInterval(ticker);frame.src='./?qa&motion=reduce';out.textContent='Reduced motion';};
</script></html>
