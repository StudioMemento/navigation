<!doctype html><html lang="it"><meta charset="utf-8"><title>NAV R6 — verifica interna</title><style>body{margin:0;background:#242424;color:white;font:12px Arial}header{padding:10px;display:flex;gap:10px;align-items:center}button{padding:8px}iframe{display:block;border:0;margin:auto}pre{white-space:pre-wrap;margin:12px}#frames{width:100%;overflow:auto}</style><header><button data-size="1363,937">Desktop</button><button data-size="1997,787">Tavola</button><button data-size="390,844">Mobile 390</button><button data-size="320,568">Mobile 320</button><button data-size="834,1194">Tablet</button><button data-size="844,390">Landscape</button><button id="reduce">Reduced motion</button><button id="touch">Test touch / cancel</button><button id="full">Full motion</button><button id="normal">Normale</button><button id="nojs">No JS</button><button id="image">Test immagine</button><button id="edge">Hover bordo</button><button id="label">Hover testo</button><button id="leave">Uscita</button><button id="geometry">Misura controlli</button><button id="read">Leggi stato</button></header><div id="frames"><iframe title="NAV responsive" src="./?qa" width="390" height="844" style="transform-origin:top left"></iframe></div><pre id="output">In attesa.</pre><script>
const frame=document.querySelector('iframe'),out=document.querySelector('#output');
for(const button of document.querySelectorAll('[data-size]'))button.onclick=()=>{const [w,h]=button.dataset.size.split(',');frame.width=w;frame.height=h;frame.style.transform=Number(w)>innerWidth?'scale('+((innerWidth-20)/Number(w))+')':'';out.textContent=w+' × '+h};
document.querySelector('#reduce').onclick=()=>{frame.src='./?qa&motion=reduce'};document.querySelector('#read').onclick=()=>{const doc=frame.contentDocument,win=frame.contentWindow,nav=doc.querySelector('memento-nav'),root=nav.shadowRoot;out.textContent=JSON.stringify({state:win.__MEMENTO_QA?.state(),viewport:[win.innerWidth,win.innerHeight],scrollWidth:doc.documentElement.scrollWidth,mask:doc.querySelector('.card[data-slot="active"] .card-reveal').style.maskImage,images:[...doc.querySelectorAll('.card-image')].map(i=>({ok:i.complete&&i.naturalWidth>0})),logo:root.querySelector('.mm-wordmark').getBoundingClientRect().toJSON(),nav:[...root.querySelectorAll('.mm-link')].map(a=>({url:a.href,current:a.getAttribute('aria-current')}))},null,2);};
document.querySelector('#full').onclick=()=>{frame.src='./?qa#levelup'};document.querySelector('#normal').onclick=()=>{frame.src='./#levelup'};document.querySelector('#nojs').onclick=()=>{frame.setAttribute('sandbox','allow-same-origin');frame.src='./?nojs'};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
document.querySelector('#touch').onclick=async()=>{try{const w=frame.contentWindow,doc=frame.contentDocument,hub=doc.querySelector('#hub');function ev(type,x=12,y=200){hub.dispatchEvent(new w.PointerEvent(type,{pointerId:91,pointerType:'touch',isPrimary:true,bubbles:true,button:0,clientX:x,clientY:y}));}ev('pointerdown');let down=w.__MEMENTO_QA.state();ev('pointerup');let up=w.__MEMENTO_QA.state();await sleep(1300);let beforeCancel=w.__MEMENTO_QA.state().pulsesNow;ev('pointerdown');ev('pointercancel');let cancel=w.__MEMENTO_QA.state();const passed=down.contact&&down.power===1&&!up.contact&&up.pulsesNow===1&&!cancel.contact&&cancel.power===0&&cancel.pulsesNow===beforeCancel;out.textContent=JSON.stringify({result:passed?'TOUCH_CANCEL_PASS':'FAIL',down,up,cancel},null,2);}catch(e){out.textContent=String(e)}};
</script></html>
<script>
document.querySelector('#image').onclick=async()=>{try{const w=frame.contentWindow,d=frame.contentDocument,hub=d.querySelector('#hub'),card=d.querySelector('.card[data-slot="active"]'),rect=card.getBoundingClientRect();const move=(x,y)=>hub.dispatchEvent(new w.PointerEvent('pointermove',{pointerType:'mouse',pointerId:37,isPrimary:true,bubbles:true,clientX:x,clientY:y}));move(rect.x+rect.width/2,rect.y+rect.height/2);await sleep(1700);const hover=card.dataset.imageState;move(2,2);await sleep(2300);const idle=card.dataset.imageState;out.textContent=JSON.stringify({result:hover==='color'&&idle==='neutral'?'IMAGE_GATE_PASS':'FAIL',hover,idle},null,2);}catch(e){out.textContent=e.stack}};
</script><script>
for(const id of ['edge','label','leave'])document.getElementById(id).onclick=()=>{const w=frame.contentWindow,d=frame.contentDocument,hub=d.getElementById('hub'),card=d.querySelector('.card[data-slot="active"]'),r=(id==='label'?card.querySelector('.title'):card).getBoundingClientRect();const x=id==='edge'?r.x+3:id==='label'?r.x+r.width*.3:-999,y=id==='edge'?r.y+r.height*.45:id==='label'?r.y+r.height*.5:-999;hub.dispatchEvent(new w.PointerEvent('pointermove',{pointerType:'mouse',pointerId:37,isPrimary:true,bubbles:true,clientX:x,clientY:y}));out.textContent=id;};
document.getElementById('geometry').onclick=()=>{const d=frame.contentDocument,root=d.querySelector('memento-nav').shadowRoot,up=d.getElementById('previous').getBoundingClientRect(),down=d.getElementById('next').getBoundingClientRect(),logo=root.querySelector('.mm-wordmark').getBoundingClientRect(),dock=root.querySelector('.mm-dock').getBoundingClientRect();out.textContent=JSON.stringify({logoGap:up.top-logo.bottom,dockGap:dock.top-down.bottom,overflow:d.documentElement.scrollWidth>frame.contentWindow.innerWidth,hint:d.getElementById('gesture-hint').hidden},null,2);};
</script>
