<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0c0d">
  <meta name="description" content="Memento è uno studio di design: identità, immagini, siti web ed esperienze digitali. Esplora i servizi, i progetti e le demo interattive.">
  <meta name="robots" content="noindex, nofollow">
  <title>Memento — Design da ricordare.</title>
  <link rel="icon" href="./favicon.svg">
  <link rel="preload" href="./assets/InterVariable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="./assets/dioramas/memento.webp" as="image">
  <link rel="stylesheet" href="./src/styles.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Vai al contenuto</a>
  <header class="site-header">
    <a class="wordmark" href="#/" aria-label="Memento, home"><img src="./assets/memento-wordmark.svg" alt="Memento" width="154" height="24"></a>
    <span class="header-note">Design studio</span>
    <button class="menu-toggle" aria-expanded="false" aria-controls="main-nav">Menu</button>
    <nav id="main-nav" aria-label="Navigazione principale">
      <a href="#/studio" data-section="studio">Studio</a>
      <a href="#/servizi" data-section="servizi">Servizi</a>
      <a href="#/portfolio" data-section="portfolio">Portfolio</a>
      <a href="#/level-up" data-section="level-up">Level Up</a>
      <a class="nav-start" href="#/start" data-section="start">Parliamone <img src="./sockets/servizi/assets/icons/caret-right.svg" alt=""></a>
    </nav>
  </header>
  <main id="main-content" tabindex="-1"></main>
  <p id="announcement" class="sr-only" role="status" aria-live="polite"></p>
  <dialog id="lightbox" aria-label="Galleria del progetto">
    <header class="lightbox-bar"><p id="lightbox-caption"></p><button class="icon-button" data-action="close-gallery" aria-label="Chiudi galleria"><img src="./sockets/servizi/assets/icons/x.svg" alt=""></button></header>
    <div class="lightbox-stage"><button class="icon-button" data-action="previous-image" aria-label="Immagine precedente"><img src="./sockets/servizi/assets/icons/caret-left.svg" alt=""></button><img id="lightbox-image" alt=""><button class="icon-button" data-action="next-image" aria-label="Immagine successiva"><img src="./sockets/servizi/assets/icons/caret-right.svg" alt=""></button></div>
    <p class="lightbox-help">Usa le frecce per esplorare · Esc per chiudere</p>
  </dialog>
  <noscript><div class="no-script"><h1>Memento</h1><p>Attiva JavaScript per esplorare progetti e servizi.</p><a href="mailto:info@mementostudio.it">info@mementostudio.it</a></div></noscript>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
