<!doctype html>
<html lang="it"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000"><meta name="description" content="Studio di design & esperienze digitali. Esplora Memento.">
<title>Memento — Studio di design & esperienze digitali</title>
<style id="memento-first-paint">html,body{background:#000}html.vfx-boot #hub{opacity:0}</style>
<script>/* VFX boot: the cards wait in black until the engine draws its first frame ("dal nero alla materia"). Failsafe: 3 s. */
(()=>{try{const r=document.documentElement;if(document.createElement('canvas').getContext('webgl2')){r.classList.add('vfx-boot');setTimeout(()=>r.classList.remove('vfx-boot'),3000);}}catch(e){}})();</script>
<link rel="icon" href="/favicon.svg"><link rel="preload" href="/assets/fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin>
</head><body>
<h1 class="sr-only">Memento — Studio di design & esperienze digitali</h1>
<canvas id="world" aria-hidden="true"></canvas>
<main id="hub" aria-label="Esplora Memento" aria-roledescription="carosello">
<div id="scene"></div>
<button id="previous" class="chevron" aria-label="Sezione precedente"><svg viewBox="0 0 60 32" aria-hidden="true"><path d="M2 30 30 2 58 30"/></svg></button>
<button id="next" class="chevron" aria-label="Sezione successiva"><svg viewBox="0 0 60 32" aria-hidden="true"><path d="M2 2 30 30 58 2"/></svg></button>
<p class="sr-only" id="status" aria-live="polite" aria-atomic="true"></p>
</main>
<noscript><nav class="no-js"><a href="https://mementostudio.it/studio">Studio</a><a href="https://mementostudio.it/services">Services</a><a href="https://mementostudio.it/projects">Projects</a><a href="https://mementostudio.it/levelup">LevelUp</a><a href="https://mementostudio.it/start">Start</a></nav></noscript>
<script type="module" src="/src/main.js"></script></body></html>
