<!doctype html><html lang="it"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070809"><meta name="description" content="Memento. Studio, servizi, portfolio e nuove possibilità."><title>Memento</title>
<link rel="icon" href="./favicon.svg"><link rel="preload" href="./assets/InterVariable.woff2" as="font" type="font/woff2" crossorigin><link rel="preload" href="./assets/dioramas/memento.webp" as="image"><link rel="preload" href="./assets/obsidian-square.webp" as="image"><link rel="stylesheet" href="./style.css"></head>
<body data-view="gate" data-world="memento"><div id="app">
<canvas id="atmosphere" aria-hidden="true"></canvas><div class="vignette" aria-hidden="true"></div>
<div class="world-heading"><h1 id="world-title">MEMENTO</h1></div>
<div id="fallback" aria-hidden="true"><img id="model-poster" src="./assets/dioramas/memento.webp" alt=""></div>
<div id="outline-mask" aria-hidden="true"><div class="world-heading"><span id="outline-title">MEMENTO</span></div></div><div id="scene" aria-hidden="true"></div>
<header class="header"><button class="wordmark" data-action="home" aria-label="Memento, torna alla home"><img src="./assets/memento-wordmark.svg" alt="Memento"></button></header>
<button id="atmosphere-toggle" class="atmosphere-toggle" aria-label="Regola l’ambiente" aria-expanded="false" aria-controls="atmosphere-controls"></button>
<div id="atmosphere-controls" class="atmosphere-controls" hidden><label>Ambiente<input id="ambient" type="range" min="0" max="100" value="55"></label><label>Profondità<input id="depth" type="range" min="0" max="100" value="60"></label><label>Parallasse<input id="parallax" type="range" min="0" max="100" value="50"></label></div>
<main><section id="gateway" aria-label="Esplora le sezioni"><button class="vertical-arrow previous" data-action="previous-world" aria-label="Sezione precedente"></button><button id="cube-target" aria-label="Entra nello Studio"></button><button class="vertical-arrow next" data-action="next-world" aria-label="Sezione successiva"></button></section>
<section id="socket" aria-label="Esplora la sezione" inert><div id="socket-frames"></div><div class="socket-loading" role="status" aria-label="Caricamento"><span></span></div><button id="socket-expand" aria-label="Espandi la sezione"></button><div id="socket-error" hidden><p>La sezione non è disponibile.</p><button data-action="retry-socket">Riprova</button><a id="socket-source" target="_blank" rel="noopener">Apri la sezione ↗</a></div></section></main>
<nav id="navbar" class="navbar" aria-label="Navigazione principale"></nav><div id="announcement" class="sr-only" aria-live="polite"></div></div>
<noscript><p class="no-script">Attiva JavaScript per esplorare Memento. <a href="https://mementostart.vercel.app/">Contatti</a></p></noscript><script type="module" src="./app.js"></script></body></html>
