<!doctype html>
<html lang="it" data-socket="level-up">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#060606">
  <meta name="description" content="Le esperienze digitali di Memento. Scegli una demo, provala, immagina il tuo prossimo progetto.">
  <title>Level Up — Memento</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/InterVariable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/previews/icecream.webp" as="image" fetchpriority="high">
  <link rel="stylesheet" href="style.css">
  <script src="panel-geometries.js" defer></script>
  <script src="experiences.js" defer></script>
  <script src="app.js" defer></script>
<link rel="stylesheet" href="../embed.css"><script src="../bridge.js" defer></script></head>
<body>
  <main class="showcase" id="showcase">
    <header class="intro rail">
      <span class="wordmark" aria-label="Memento">MEMENTO</span>
      <h1 class="amber-type">L’hai visto.<br>Ora provalo.</h1>
    </header>
    <section class="gallery" aria-label="Le esperienze Memento" aria-roledescription="Carosello">
      <div class="stage" id="stage"><div class="slides" id="slides"></div></div>
      <nav class="gallery-nav" aria-label="Scegli un’esperienza">
        <button class="nav-arrow" id="previous" aria-label="Esperienza precedente"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 5-7 7 7 7"/></svg></button>
        <div class="pagination" id="pagination"></div>
        <button class="nav-arrow" id="next" aria-label="Esperienza successiva"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 5 7 7-7 7"/></svg></button>
      </nav>
      <p class="sr-only" id="slide-announcement" role="status" aria-live="polite" aria-atomic="true"></p>
    </section>
    <footer class="contact-rail rail">
      <button class="contact-invite" id="contact-cta" aria-label="Pronto a fare il level up? Parliamone">
        <span class="invite-question amber-type">Pronto a fare<br>il level up?</span>
        <span class="invite-action">Parliamone <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 5 7 7-7 7"/></svg></span>
      </button>
    </footer>
  </main>
  <dialog class="player" id="experience-dialog" aria-labelledby="experience-title">
    <div class="player-frame" id="player-frame">
      <header class="player-toolbar">
        <h2 id="experience-title">Esperienza</h2>
        <div class="player-controls">
          <a class="icon-button" id="external-experience" href="#" target="_blank" rel="noopener noreferrer" aria-label="Apri esperienza in una nuova scheda"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M7 7h10v10"/></svg></a>
          <button class="icon-button" id="close-player" aria-label="Chiudi esperienza" autofocus><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button>
        </div>
      </header>
      <div class="player-content">
        <div class="player-poster" id="player-poster" aria-hidden="true"></div>
        <div class="frame-mount" id="frame-mount"></div>
        <div class="loading" id="frame-loading" role="status" aria-label="Caricamento esperienza"><i></i></div>
        <a class="load-fallback" id="load-fallback" target="_blank" rel="noopener noreferrer" hidden>Apri l’esperienza ↗</a>
      </div>
    </div>
    <button class="player-invite" id="player-contact">
      <span class="amber-type">Pronto a fare <span class="nowrap">il level up?</span></span>
      <span>Parliamone <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 5 7 7-7 7"/></svg></span>
    </button>
  </dialog>
  <dialog class="contact-dialog" id="contact-dialog" aria-labelledby="form-title">
    <button class="icon-button contact-close" id="close-contact" aria-label="Chiudi contatto" autofocus><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button>
    <h2 class="amber-type" id="form-title">Il tuo prossimo<br>level up.</h2>
    <form id="contact-form">
      <label>Nome<input name="name" autocomplete="name" required maxlength="100"></label>
      <label>Email<input type="email" name="email" autocomplete="email" required maxlength="160"></label>
      <label>Telefono <span>/ facoltativo</span><input type="tel" name="phone" autocomplete="tel" maxlength="35"></label>
      <label>La tua idea<textarea name="message" rows="3" required maxlength="4000"></textarea></label>
      <button class="send-button" type="submit">Prepara l’email <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 5 7 7-7 7"/></svg></button>
      <p id="form-status" role="status"></p>
    </form>
    <a class="direct-email" href="mailto:info@mementostudio.it">info@mementostudio.it</a>
  </dialog>
  <noscript><p class="noscript-message">Attiva JavaScript per esplorare le esperienze. <a href="mailto:info@mementostudio.it">Contatta Memento</a></p></noscript>
</body>
</html>
