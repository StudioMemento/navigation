<main class="studio-web" id="studio-main" data-phase="preparing" aria-labelledby="studio-title">
  <svg class="studio-icons" aria-hidden="true" focusable="false">
    <symbol id="studio-replay" viewBox="0 0 24 24"><path d="M3 11a9 9 0 1 1 2.8 7.1M3 5v6h6"/></symbol>
    <symbol id="studio-skip" viewBox="0 0 24 24"><path d="m5 5 10 7-10 7zM19 5v14"/></symbol>
    <symbol id="studio-expand" viewBox="0 0 24 24"><path d="M8.2 4H4v4.2M15.8 4H20v4.2M20 15.8V20h-4.2M8.2 20H4v-4.2"/></symbol>
    <symbol id="studio-shrink" viewBox="0 0 24 24"><path d="M4 8.2h4.2V4M15.8 4v4.2H20M20 15.8h-4.2V20M8.2 20v-4.2H4"/></symbol>
    <symbol id="studio-home" viewBox="0 0 24 24"><path d="m12 2.7 8.2 4.8v9l-8.2 4.8-8.2-4.8v-9z"/><path d="m3.8 7.5 8.2 4.8 8.2-4.8M12 12.3v9"/></symbol>
    <symbol id="studio-minus" viewBox="0 0 24 24"><path d="M6 12h12"/></symbol>
    <symbol id="studio-plus" viewBox="0 0 24 24"><path d="M6 12h12M12 6v12"/></symbol>
    <symbol id="studio-orbit" viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="9.3" ry="4.7" transform="rotate(-22 12 12)"/><path d="M12 5.2v1.4M12 17.4v1.4"/><circle cx="12" cy="12" r="1"/></symbol>
  </svg>
  <div class="studio-viewport" id="studio" tabindex="0" role="group" aria-roledescription="visore 3D" aria-label="Studio Memento in vista isometrica" aria-describedby="studio-help">
    <span class="studio-ignition" aria-hidden="true"></span>
    <canvas class="studio-render" aria-hidden="true"></canvas>
    <img class="studio-poster" alt="Vista isometrica dello studio, con il salotto in primo piano e i cinque schermi delle postazioni sulla parete di fondo." hidden>
  </div>
  <p id="studio-help" class="mm-sr">Trascina o usa i tasti freccia per ruotare il modello. Con due dita, la rotella o i tasti più e meno regoli lo zoom. Il tasto Home ripristina la vista iniziale.</p>
  <div class="studio-top">
    <button type="button" class="studio-tool studio-text-tool" data-action="replay" aria-label="Mostra studio" title="Mostra studio" disabled><svg aria-hidden="true"><use href="#studio-skip"/></svg><span>Mostra studio</span></button>
    <button type="button" class="studio-tool" data-action="fullscreen" aria-label="Schermo intero" title="Schermo intero" hidden><svg aria-hidden="true"><use href="#studio-expand"/></svg></button>
  </div>
  <div class="studio-caption">
    <h1 id="studio-title" class="studio-title">Studio</h1>
    <p class="studio-hint"><svg aria-hidden="true"><use href="#studio-orbit"/></svg>Trascina per ruotare</p>
    <button type="button" class="studio-retry" hidden>Riattiva la vista 3D</button>
  </div>
  <div class="studio-view-tools" role="group" aria-label="Controlli della vista">
    <button type="button" class="studio-tool" data-action="zoom-out" aria-label="Riduci zoom" title="Riduci zoom" disabled><svg aria-hidden="true"><use href="#studio-minus"/></svg></button>
    <button type="button" class="studio-tool" data-action="home" aria-label="Ripristina vista isometrica" title="Ripristina vista isometrica" disabled><svg aria-hidden="true"><use href="#studio-home"/></svg></button>
    <button type="button" class="studio-tool" data-action="zoom-in" aria-label="Aumenta zoom" title="Aumenta zoom" disabled><svg aria-hidden="true"><use href="#studio-plus"/></svg></button>
  </div>
  <div class="studio-status mm-sr" role="status" aria-live="polite"></div>
  <!--studio-noscript-->
</main>
