<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070809">
<meta name="description" content="Studio di design & esperienze digitali. Cinque spazi, un unico universo. Esplora Memento.">
<title>Memento — Studio di design & esperienze digitali</title>
<link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
<link rel="preload" href="./assets/fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="./assets/scenes/studio-480.webp" as="image" media="(max-width:600px)">
<link rel="stylesheet" href="./src/style.css">
<script>
if(!matchMedia('(prefers-reduced-motion:reduce)').matches)document.documentElement.classList.add('fx-boot');
function restoreNav(){document.documentElement.classList.remove('fx-boot');for(const el of document.querySelectorAll('.card-reveal')){el.style.maskImage='none';el.style.webkitMaskImage='none'}if(!document.querySelector('.card'))document.getElementById('fallback').hidden=false;}
addEventListener('error',restoreNav);addEventListener('unhandledrejection',restoreNav);setTimeout(()=>{if(!window.__navReady)restoreNav()},3000);
</script>
</head>
<body>
<h1 class="sr-only">Memento — Studio di design & esperienze digitali</h1>
<canvas id="field" aria-hidden="true"></canvas>

<main id="hub" tabindex="-1" aria-label="Esplora Memento" aria-roledescription="carosello">
 <div class="scene-window"><div id="scene" class="scene"></div></div>
 <button id="previous" class="chevron previous" aria-label="Sezione precedente"><svg viewBox="0 0 30 14" aria-hidden="true"><path d="m1 13 14-12 14 12"/></svg></button>
 <button id="next" class="chevron next" aria-label="Sezione successiva"><svg viewBox="0 0 30 14" aria-hidden="true"><path d="m1 1 14 12 14-12"/></svg></button>
 <p class="sr-only" id="status" aria-live="polite" aria-atomic="true"></p>
</main>
<p class="gesture-hint" aria-hidden="true">SCORRI PER ESPLORARE</p>
<nav hidden id="fallback" class="fallback" aria-label="Sezioni Memento"><a href="https://mementostudio.it/studio">Studio</a><a href="https://mementostudio.it/services">Services</a><a href="https://mementostudio.it/projects">Projects</a><a href="https://mementostudio.it/levelup">LevelUp</a><a href="https://mementostudio.it/start">Start</a></nav><noscript><style>#fallback{display:flex!important}</style></noscript>
<script type="module" src="./src/app.mjs"></script>
</body>
</html>
