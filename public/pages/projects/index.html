<!doctype html>
<html lang="it">
<head>


  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c0c0c">
  <meta name="description" content="Progetti Memento Design Studio. Web, 3D, video, visual, design e branding.">
  <title>Portfolio — Memento</title>
  <link rel="icon" href="data:,">
  <link rel="preload" href="assets/fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
<meta name="robots" content="noindex, nofollow"><link rel="stylesheet" href="/src/page-embed.css"><script src="/src/page-bridge.js" defer data-page="projects"></script></head>
<body>
  <a class="skip-link" href="#catalogo">Vai ai progetti</a>
  <main id="viewport" tabindex="-1">
    <section id="catalogue" class="catalogue" aria-labelledby="catalogue-title">
      <header class="catalogue-heading"><h1 id="catalogue-title">Progetti.</h1><nav id="filters" class="filters" aria-label="Domini dei progetti"></nav></header>
      <div id="project-grid" class="project-grid"></div>
      <div id="empty-state" class="empty-state" hidden><span>Nessun progetto.</span><button data-action="reset-filters">Tutti i progetti</button></div>
      <footer class="footer"><a href="https://mementostart.vercel.app/">Ready to<br>start?<svg viewBox="0 0 100 160" aria-hidden="true"><path d="m20 10 70 70-70 70"/></svg></a></footer>
    </section>
    <section id="project-view" hidden aria-label="Player portfolio"></section>
  </main>
  <nav id="project-nav" class="project-nav" aria-label="Navigazione portfolio" hidden>
    <a href="#catalogo" class="catalogue-back" data-action="close-project" aria-label="Tutti i progetti — torna al catalogo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 5-7 7 7 7"/></svg><span>Tutti i progetti</span></a>
  </nav>
  <nav id="scroll-cue" class="scroll-cue" aria-label="Scorri il progetto" hidden>
    <button class="cue-button" data-action="checkpoint-start" aria-label="Torna all’inquadratura iniziale"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 15 6-6 6 6"/></svg></button>
    <div class="cue-track"><span class="cue-line"></span><input id="project-progress" type="range" min="0" max="1000" value="0" step="1" aria-label="Avanzamento nel progetto" aria-orientation="vertical"><div id="cue-stops" class="cue-stops"></div></div>
    <button class="cue-button" data-action="checkpoint-next" aria-label="Vai al prossimo contenuto"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
  </nav>
  <dialog id="media-dialog" class="media-dialog" aria-labelledby="media-title">
    <div class="media-shell">
      <div class="media-toolbar"><h2 id="media-title"></h2><a id="media-external" class="icon-button" target="_blank" rel="noopener noreferrer" aria-label="Apri contenuto in una nuova scheda" title="Apri in una nuova scheda" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19 19 5M5 5h14v14"/></svg></a><button class="icon-button" data-action="close-media" aria-label="Chiudi esperienza"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button></div>
      <div id="media-content"></div><div id="media-navigation" class="media-navigation"></div>
    </div>
  </dialog>
  <div class="sr-only" id="announcement" aria-live="polite" aria-atomic="true"></div>
  <noscript><p>Attiva JavaScript per esplorare il portfolio. <a href="mailto:info@mementostudio.it">info@mementostudio.it</a></p></noscript>
</body>
</html>
